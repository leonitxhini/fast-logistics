kind = "web"
previewPath = "/"
title = "Fast Logistics L.L.C"
version = "1.0.0"
id = "artifacts/fast-logistics"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21949

[services.development]
run = "pnpm --filter @workspace/fast-logistics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fast-logistics", "run", "build" ]
publicDir = "artifacts/fast-logistics/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21949"
BASE_PATH = "/"
